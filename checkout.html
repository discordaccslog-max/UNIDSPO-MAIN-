<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — United Dispo</title>
<meta name="description" content="Secure checkout — United Dispo.">
<link rel="canonical" href="https://uniteddispo.com/checkout.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --bg: #0e0e10;
    --side: #151517;
    --field: #17181a;
    --line: rgba(255,255,255,.10);
    --line-2: rgba(255,255,255,.16);
    --text: #f2f2f3;
    --muted: #9ea0a6;
    --dim: #8e9096;
    --gold: #d4af37;
    --gold-hi: #ffd976;
    --err: #ff8a80;
    --ok: #7fd3a8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---------- Header ---------- */
  .co-head { background: #000; border-bottom: 1px solid var(--line); }
  .co-head__in { max-width: 1180px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .co-logo { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .16em; text-decoration: none; color: #fff; white-space: nowrap; }
  .co-tp { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-decoration: none; }
  .co-tp__row { display: flex; align-items: center; gap: 8px; }
  .co-tp__brand { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; color: #fff; }
  .co-tp__brand svg { width: 18px; height: 18px; }
  .co-tp__boxes { display: inline-flex; gap: 2px; }
  .co-tp__boxes i { width: 19px; height: 19px; display: grid; place-items: center; background: #00b67a; }
  .co-tp__boxes i.is-part { background: linear-gradient(90deg, #00b67a 70%, #dcdce6 70%); }
  .co-tp__boxes svg { width: 13px; height: 13px; color: #fff; }
  .co-tp__score { font-weight: 700; font-size: 14px; color: #fff; }
  .co-tp__sub { font-size: 12.5px; color: var(--muted); }
  .co-tp__sub b { color: #fff; }

  /* ---------- Layout ---------- */
  .co { display: grid; grid-template-columns: minmax(0, 55fr) minmax(0, 45fr); min-height: calc(100vh - 90px); }
  .co-main { padding: 44px 56px 72px 32px; display: flex; justify-content: flex-end; }
  .co-main__in { width: 100%; max-width: 560px; }
  .co-side { background: var(--side); border-left: 1px solid var(--line); padding: 44px 32px 72px 48px; }
  .co-side__in { width: 100%; max-width: 420px; position: sticky; top: 28px; }

  /* Mobile summary bar */
  .co-bar { display: none; }

  @media (max-width: 999px) {
    .co { grid-template-columns: 1fr; }
    .co-main { padding: 28px 20px 56px; justify-content: center; }
    .co-side { display: none; }
    .co-bar { display: block; background: var(--side); border-bottom: 1px solid var(--line); }
    .co-bar__btn { width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: none; border: 0; cursor: pointer; }
    .co-bar__label { display: inline-flex; align-items: center; gap: 8px; color: var(--gold-hi); font-weight: 700; font-size: 14.5px; }
    .co-bar__label svg { width: 18px; height: 18px; transition: transform .2s ease; }
    .co-bar__btn[aria-expanded="true"] .co-bar__label svg.co-bar__chev { transform: rotate(180deg); }
    .co-bar__total { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 20px; letter-spacing: .3px; color: #fff; }
    .co-bar__panel { padding: 20px 20px 22px; border-top: 1px solid var(--line); }
    .co-bar__panel[hidden] { display: none; }
    .co-head__in { padding: 16px 20px; }
    .co-logo { font-size: 22px; }
  }
  @media (max-width: 560px) {
    .co-head__in { flex-direction: column; gap: 10px; }
    .co-tp { align-items: center; }
  }

  /* ---------- Sections ---------- */
  .co-sec + .co-sec { margin-top: 38px; }
  .co-sec__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .co-h { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .1px; color: #fff; }
  .co-sec__note { margin: -6px 0 14px; color: var(--muted); font-size: 13.5px; }
  .co-row { display: grid; gap: 12px; }
  .co-row + .co-row, .co-row + .f, .f + .co-row, .f + .f { margin-top: 12px; }
  .co-row > .f { margin-top: 0 !important; }
  .co-row--2 { grid-template-columns: 1fr 1fr; }
  .co-row--3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 480px) { .co-row--3 { grid-template-columns: 1fr 1fr; } .co-row--3 .f:first-child { grid-column: 1 / -1; } }

  /* ---------- Fields (floating labels) ---------- */
  .f { position: relative; }
  .f__in { display: block; width: 100%; height: 54px; padding: 22px 14px 7px; background: var(--field); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); font-size: 16px; /* 16px+ stops iOS Safari zooming in on focus */ font-weight: 500; outline: none; appearance: none; -webkit-appearance: none; transition: border-color .15s ease, box-shadow .15s ease; }
  .f__in::placeholder { color: transparent; }
  .f__lab { position: absolute; left: 15px; top: 17px; color: var(--dim); font-size: 15px; font-weight: 500; pointer-events: none; transform-origin: left top; transition: top .15s ease, font-size .15s ease, color .15s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 30px); }
  .f__in:focus + .f__lab, .f__in:not(:placeholder-shown) + .f__lab, .f--select .f__lab { top: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
  .f__in:hover { border-color: rgba(255,255,255,.26); }
  .f__in:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.22); }
  .f__in:focus + .f__lab { color: var(--gold-hi); }
  .f--select .f__in { padding-right: 40px; cursor: pointer; }
  .f--select::after { content: ""; position: absolute; right: 16px; top: 23px; width: 8px; height: 8px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
  .f--select select option { background: #17181a; color: #f2f2f3; }
  .f.is-bad .f__in { border-color: var(--err); box-shadow: 0 0 0 3px rgba(255,138,128,.14); }
  .f__err { display: none; margin: 6px 2px 0; color: var(--err); font-size: 12.5px; font-weight: 600; }
  .f.is-bad .f__err { display: flex; align-items: center; gap: 6px; }
  .f__err svg { width: 14px; height: 14px; flex: 0 0 14px; }

  /* Checkboxes */
  .chk { display: flex; align-items: flex-start; gap: 11px; margin-top: 14px; color: #d5d6d9; font-size: 14px; cursor: pointer; line-height: 1.45; }
  .chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chk__box { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 0; border: 1.5px solid rgba(255,255,255,.3); border-radius: 5px; display: grid; place-items: center; background: var(--field); transition: background .15s ease, border-color .15s ease; }
  .chk__box svg { width: 13px; height: 13px; color: #111; opacity: 0; transition: opacity .15s ease; }
  .chk input:checked + .chk__box { background: linear-gradient(180deg, #e8c766, #ba9930); border-color: #e8c766; }
  .chk input:checked + .chk__box svg { opacity: 1; }
  .chk input:focus-visible + .chk__box { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .chk-wrap.is-bad .chk__box { border-color: var(--err); }
  .chk-wrap .f__err { margin-left: 31px; }
  .chk-wrap.is-bad .f__err { display: flex; align-items: center; gap: 6px; }

  /* ---------- Option groups (shipping + payment) ---------- */
  .opts { display: block; margin: 0; padding: 0; border: 1px solid var(--line-2); border-radius: 12px; background: var(--field); overflow: hidden; transition: border-color .15s ease; }
  .opt { position: relative; display: grid; grid-template-columns: 20px 1fr auto; align-items: start; gap: 14px; padding: 18px 18px; cursor: pointer; transition: background .15s ease; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt:hover { background: rgba(255,255,255,.025); }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt__radio { position: relative; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.32); transition: border-color .15s ease; }
  .opt__radio svg { display: none; }
  .opt__radio::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--gold); transform: scale(0); transition: transform .15s ease; }
  .opt__icon { display: none; }
  .opt--ship { grid-template-columns: 20px 1fr auto; grid-template-areas: "radio body logo" "radio body price"; grid-template-rows: auto 1fr; row-gap: 10px; }
  .opt--ship .opt__radio { grid-area: radio; margin-top: 1px; }
  .opt--ship .opt__body { grid-area: body; }
  .opt--ship > .pill, .opt--ship > .opt__price { grid-area: price; justify-self: end; align-self: start; }
  .opt__logo { grid-area: logo; justify-self: end; width: 84px; height: 34px; display: grid; place-items: center; padding: 5px 8px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .opt__logo img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .opt__logo--fedex { padding: 7px 12px; }
  /* smooth reveal of shipping methods */
  .ship-wrap { position: relative; }
  .ship-wrap.is-anim { overflow: hidden; transition: height .45s cubic-bezier(.22,1,.36,1); }
  .ship-empty.ship-in { animation: shipIn .35s ease both; }
  .opts.ship-in .opt { animation: shipIn .45s cubic-bezier(.22,1,.36,1) both; }
  .opts.ship-in .opt + .opt { animation-delay: .08s; }
  @keyframes shipIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .opt__body { min-width: 0; }
  .opt__name { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: #fff; font-weight: 700; font-size: 15px; line-height: 1.4; }
  .opt__lines { margin: 4px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
  .opt__lines .ok { display: inline-flex; align-items: center; gap: 6px; }
  .opt__lines .ok svg { width: 13px; height: 13px; color: var(--ok); }
  .opt__price { color: #fff; font-weight: 700; font-size: 15px; line-height: 1.4; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .pill--free { background: rgba(127,211,168,.12); color: var(--ok); }
  .pill--fast { border: 1px solid rgba(212,175,55,.55); color: var(--gold-hi); }
  .opt:has(input:checked) { background: rgba(212,175,55,.06); box-shadow: inset 0 0 0 1.5px var(--gold); }
  .opts > .opt:first-of-type:has(input:checked) { border-radius: 11px 11px 0 0; }
  .opts > .opt:last-of-type:has(input:checked) { border-radius: 0 0 11px 11px; }
  .opts > .opt:only-of-type:has(input:checked) { border-radius: 11px; }
  .opt:has(input:checked) + .opt { border-top-color: transparent; }
  .opt:has(input:checked) .opt__radio { border-color: var(--gold); }
  .opt:has(input:checked) .opt__radio::after { transform: scale(1); }
  .opt:has(input:focus-visible) .opt__radio { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .opt--pay { align-items: center; }
  .opt--pay .opt__name { white-space: nowrap; }
  .opt--pay .uni-pay { justify-content: flex-end; flex-wrap: nowrap; gap: 5px; }
  .opt--pay .uni-pay li { width: 38px; height: 25px; }
  .nw { white-space: nowrap; }
  .co-paynote { display: flex; align-items: flex-start; gap: 10px; margin: 12px 2px 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .co-paynote svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px; color: var(--gold); }
  .co-paynote b { color: #e6e6e8; font-weight: 700; }
  @media (max-width: 560px) {
    .opt { padding: 16px 14px; gap: 12px; }
    .opt--ship .opt__logo { width: 72px; height: 30px; padding: 4px 7px; }
    .opt--ship .opt__logo--fedex { padding: 6px 10px; }
    .opt--pay { grid-template-columns: 20px 1fr; }
    .opt--pay .opt__name { white-space: normal; }
    .opt--pay .uni-pay { grid-column: 2 / -1; justify-content: flex-start; flex-wrap: wrap; }
  }
  .opts.is-bad { border-color: var(--err); }
  .opts[hidden] { display: none; }
  .ship-empty { display: flex; align-items: center; gap: 12px; padding: 18px; border: 1px dashed var(--line-2); border-radius: 12px; background: rgba(255,255,255,.02); color: var(--muted); font-size: 14px; line-height: 1.5; }
  .ship-empty[hidden] { display: none; }
  .ship-empty svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--dim); }
  .tot__wait { color: var(--dim); font-weight: 500; font-size: 13px; }
  .opts-err { display: none; margin: 8px 2px 0; color: var(--err); font-size: 12.5px; font-weight: 600; }
  .opts-err.is-on { display: flex; align-items: center; gap: 6px; }
  .opts-err svg { width: 14px; height: 14px; }

  /* ---------- Pay ---------- */
  .co-pay { width: 100%; min-height: 56px; margin-top: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 10px; background: #d4af37; color: #111; font-family: "Figtree", sans-serif; font-weight: 700; font-size: 16.5px; letter-spacing: .01em; cursor: pointer; transition: background .15s ease; }
  .co-pay:hover { background: #e0bd4f; }
  .co-pay:active { background: #c9a42f; }
  .co-pay:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .co-pay svg { width: 17px; height: 17px; }
  .co-pay[disabled] { opacity: .75; cursor: progress; }
  .co-pay__spin { width: 18px; height: 18px; border: 2px solid rgba(17,17,17,.25); border-top-color: #111; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .co-secure { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 12px 0 0; color: var(--dim); font-size: 12.5px; }
  .co-secure svg { width: 13px; height: 13px; color: var(--dim); }
  .co-foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
  .co-foot a { color: var(--gold-hi); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
  .co-foot a:hover { text-decoration: underline; }
  .co-foot a svg { width: 15px; height: 15px; }
  .co-foot span { color: var(--dim); display: inline-flex; align-items: center; }

  /* ---------- Summary ---------- */
  .sum-line { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; }
  .sum-thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; background: #0f0f10; border: 1px solid var(--line); }
  .sum-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: block; }
  .sum-thumb__q { position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #e8c766; color: #111; font-size: 12px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--side); }
  .sum-title { margin: 0; color: #fff; font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .sum-var { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .sum-price { color: #fff; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .sum-rest { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.04); color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .sum-rest b { color: #d5d6d9; }
  .disc { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 22px; }
  .disc .f__in { height: 50px; padding-top: 20px; }
  .disc .f__lab { top: 15px; }
  .disc .f__in:focus + .f__lab, .disc .f__in:not(:placeholder-shown) + .f__lab { top: 7px; }
  .disc__btn { min-width: 92px; min-height: 50px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line-2); background: #232427; color: #e6e6e8; font-weight: 800; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .disc__btn:hover { border-color: rgba(212,175,55,.6); color: var(--gold-hi); }
  .disc__msg { grid-column: 1 / -1; margin: 0; font-size: 12.5px; font-weight: 600; color: var(--err); }
  .disc__msg[hidden] { display: none; }
  .sum-prot { margin-top: 18px; }
  .sum-prot .uni-prot { margin: 0; background: #1b1c1e; }
  .tot { margin: 20px 0 0; padding: 0; }
  .tot div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: #d5d6d9; font-size: 14px; }
  .tot dt { margin: 0; } .tot dd { margin: 0; color: #fff; font-weight: 600; }
  .tot .tot__free { color: var(--ok); font-weight: 700; }
  .tot .tot__grand { align-items: baseline; margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .tot .tot__grand dt { color: #fff; font-size: 17px; font-weight: 800; }
  .tot .tot__grand dd { font-family: "Oswald", sans-serif; font-size: 26px; font-weight: 500; letter-spacing: .3px; }
  .tot .tot__grand dd small { margin-right: 6px; font-family: "Figtree", sans-serif; font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .04em; }
  .trust { list-style: none; margin: 24px 0 0; padding: 22px 0 0; border-top: 1px solid var(--line); display: grid; gap: 16px; }
  .trust li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
  .trust svg { width: 20px; height: 20px; color: var(--gold); margin-top: 1px; }
  .trust b { display: block; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.35; }
  .trust span { color: var(--muted); font-size: 13px; line-height: 1.45; }

  /* ---------- Confirmation + empty ---------- */
  .done { text-align: left; }
  .done__icon { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: rgba(212,175,55,.12); color: var(--gold-hi); margin-bottom: 18px; }
  .done__icon svg { width: 30px; height: 30px; }
  .done__kicker { margin: 0; color: var(--gold-hi); font-size: 12.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .done__h { margin: 6px 0 10px; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 36px; line-height: 1.15; color: #fff; }
  .done__p { margin: 0; color: #c9cbd0; font-size: 15.5px; line-height: 1.65; }
  .done__p b { color: #fff; }
  .done__card { margin-top: 24px; padding: 18px 20px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--field); display: grid; gap: 12px; }
  .done__card div { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--muted); }
  .done__card div b { color: #fff; text-align: right; }
  .done__btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 26px; padding: 0 30px; border-radius: 999px; border: 1px solid #ffd700; background: linear-gradient(180deg, #e8c766, #ba9930); color: #111; font-family: "Oswald", sans-serif; font-size: 17px; letter-spacing: 1.2px; text-transform: uppercase; text-decoration: none; }
  .done__btn:hover { background: linear-gradient(180deg, #ffd976, #c8a732); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .opt:hover { transform: none; }
  }
</style>
</head>
<body>

<header class="co-head">
  <div class="co-head__in">
    <a class="co-logo" href="index.html" aria-label="United Dispo home">UNITED DISPO</a>
    <a class="co-tp" href="index.html#reviews" aria-label="Rated Excellent, 4.7 out of 5 on Trustpilot">

    if (inp) inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
  }
  function check(key) { var el = $('#' + key); var msg = RULES[key](el.value.trim()); setErr(key, msg); return !msg; }
  Object.keys(RULES).forEach(function (k) {
    var el = $('#' + k);
    el.addEventListener('blur', function () { if (el.value.trim() || el.closest('.is-bad')) check(k); });
    el.addEventListener('input', function () { if (el.closest('.is-bad')) check(k); });
    el.addEventListener('change', function () { if (el.closest('.is-bad')) check(k); });
  });
  ADDR.forEach(function (k) { var el = $('#' + k); el.addEventListener('input', updateShip); el.addEventListener('change', updateShip); });
  updateShip();
  $('#age').addEventListener('change', function () { if (this.checked) setErr('age', ''); });
  document.querySelectorAll('input[name="pay"]').forEach(function (r) {
    r.addEventListener('change', function () { $('#pay-opts').classList.remove('is-bad'); var e = $('#pay-err'); e.classList.remove('is-on'); e.innerHTML = ''; });
  });

  var form = $('#co-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var firstBad = null;
    Object.keys(RULES).forEach(function (k) { if (!check(k) && !firstBad) firstBad = $('#' + k); });
    if (!$('#age').checked) { setErr('age', 'Please confirm you are 21 or older'); if (!firstBad) firstBad = $('#age'); }
    var pay = document.querySelector('input[name="pay"]:checked');
    if (!pay) {
      $('#pay-opts').classList.add('is-bad');
      var pe = $('#pay-err'); pe.classList.add('is-on'); pe.innerHTML = ERR_ICON + 'Select a payment method';
      if (!firstBad) firstBad = document.querySelector('input[name="pay"]');
    }
    if (firstBad) {
      var target = firstBad.closest('.f, .chk-wrap, .opts') || firstBad;
      target.scrollIntoView({ block: 'center', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      firstBad.focus({ preventScroll: true });
      return;
    }
    placeOrder();
  });

  /* ---------- Place order ----------
     Fires a cancelable "uni:place-order" event with everything a payment
     processor needs. Until one is connected, the demo shows the confirmation. */
  function placeOrder() {
    var t = totals(), ship = shipChoice();
    var data = {};
    FIELDS.forEach(function (k) { data[k] = $('#' + k).value.trim(); });
    if ($('#save').checked) { try { localStorage.setItem(INFO_KEY, JSON.stringify(data)); } catch (e) {} }
    else { try { localStorage.removeItem(INFO_KEY); } catch (e) {} }
    var order = {
      item: line, customer: data,
      shipping: { method: ship, price: t.ship, estimate: range(ship === 'express' ? exp : std) },
      shippingProtection: !!t.prot, protectionPrice: t.prot,
      payment: 'card', subtotal: t.sub, total: t.total
    };
    var ev; try { ev = new CustomEvent('uni:place-order', { cancelable: true, detail: order }); } catch (err) { ev = null; }
    if (ev && !document.dispatchEvent(ev)) return;

    var btn = $('#co-pay');
    btn.disabled = true;
    btn.innerHTML = '<span class="co-pay__spin" aria-hidden="true"></span><span>Processing…</span>';
    setTimeout(function () { confirmation(order); }, 1100);
  }

  function confirmation(order) {
    C.remove(line.slug, line.variant || '');
    var num = 'UD-' + String(Math.floor(10000 + Math.random() * 90000));
    var d = order.customer;
    main.innerHTML =
      '<div class="done" tabindex="-1" id="done">' +
        '<span class="done__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
        '<p class="done__kicker">Order ' + num + '</p>' +
        '<h1 class="done__h">Thank you, ' + esc(d.first) + '!</h1>' +
        '<p class="done__p">Your order is confirmed. We’ve sent a confirmation to <b>' + esc(d.email) + '</b>, and your tracking number will follow as soon as it ships.</p>' +
        '<div class="done__card">' +
          '<div><span>Estimated delivery</span><b>' + esc(order.shipping.estimate) + '</b></div>' +
          '<div><span>Shipping</span><b>' + (order.shipping.method === 'express' ? 'Express FedEx' : 'Standard USPS') + '</b></div>' +
          '<div><span>Ship to</span><b>' + esc(d.address) + (d.apt ? ', ' + esc(d.apt) : '') + '<br>' + esc(d.city) + ', ' + esc(d.state) + ' ' + esc(d.zip) + '</b></div>' +
          '<div><span>Total paid</span><b>' + fmt.format(order.total) + ' USD</b></div>' +
        '</div>' +
        (others ? '<p class="done__p" style="margin-top:20px">You still have <b>' + others + (others === 1 ? ' item' : ' items') + '</b> in your cart. Check out the next one whenever you’re ready, and everything ships together.</p>' : '') +
        '<a class="done__btn" href="' + (others ? 'cart.html' : 'catalog.html') + '">' + (others ? 'Check out next item' : 'Continue shopping') + '</a>' +
      '</div>';
    document.querySelectorAll('.disc, .sum-prot').forEach(function (el) { el.style.display = 'none'; });
    window.scrollTo(0, 0);
    $('#done').focus({ preventScroll: true });
  }
})();
</script>
</body>
</html>
