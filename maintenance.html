<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance — United Dispo</title>
<meta name="description" content="United Dispo is temporarily down for maintenance.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;display=swap">
<style>
  :root{--bg:#0e0e10;--panel:#141416;--line:rgba(255,255,255,.09);--text:#f2f2f3;--muted:#9ea0a6;--dim:#8e9096;--gold:#d4af37;--gold-hi:#ffd976}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:40px 20px;background:
      radial-gradient(70% 55% at 50% 0%,rgba(212,175,55,.12),rgba(212,175,55,0) 65%),var(--bg);
    color:var(--text);font:500 15px/1.6 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-align:center}

  .wrap{width:100%;max-width:560px}

  .logo{font-family:"Oswald",sans-serif;font-weight:500;font-size:clamp(24px,5vw,32px);letter-spacing:.18em;color:#fff;margin:0 0 40px}

  .icon{position:relative;width:86px;height:86px;margin:0 auto 26px;display:grid;place-items:center;border-radius:50%;
    background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);color:var(--gold-hi)}
  .icon::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(212,175,55,.25);animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.18);opacity:0}}
  .icon svg{width:38px;height:38px;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 14px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
  .eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:currentColor}

  h1{margin:0 0 14px;font-family:"Oswald",sans-serif;font-weight:500;font-size:clamp(34px,7vw,52px);line-height:1.08;letter-spacing:.3px;color:#fff}
  .lead{margin:0 auto;max-width:42ch;color:var(--muted);font-size:16.5px;line-height:1.65;text-wrap:balance}

  .card{margin:34px 0 0;padding:24px 22px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
  .card__label{margin:0 0 6px;color:var(--dim);font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
  .card__value{margin:0;font-family:"Oswald",sans-serif;font-weight:500;font-size:clamp(28px,6vw,38px);line-height:1.1;letter-spacing:.4px;color:var(--gold-hi)}
  .card__back{margin:12px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  .card__back b{color:#fff;font-weight:700}

  .count{display:flex;justify-content:center;gap:10px;margin:20px 0 0}
  .count[hidden]{display:none}
  .unit{min-width:68px;padding:10px 8px;border-radius:10px;background:#101011;border:1px solid var(--line)}
  .unit b{display:block;font-family:"Oswald",sans-serif;font-weight:500;font-size:26px;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
  .unit span{display:block;margin-top:2px;color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}

  .foot{margin:30px 0 0;color:var(--dim);font-size:13px;line-height:1.6}

  @media(prefers-reduced-motion:reduce){.icon svg,.icon::after{animation:none}}
</style>
</head>
<body>
  <main class="wrap">
    <p class="logo">UNITED DISPO</p>

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>

    <p class="eyebrow">Temporarily offline</p>
    <h1>Under maintenance</h1>
    <p class="lead">We're making some improvements to the store. Everything will be back up shortly — thanks for your patience.</p>

    <div class="card">
      <p class="card__label">Estimated downtime</p>
      <p class="card__value">2 hours</p>
      <p class="card__back" id="back" hidden>Expected back around <b id="back-time"></b></p>
    </div>

    <div class="count" id="count" role="timer" aria-live="off" hidden>
      <span class="unit"><b id="c-h">--</b><span>Hours</span></span>
      <span class="unit"><b id="c-m">--</b><span>Mins</span></span>
      <span class="unit"><b id="c-s">--</b><span>Secs</span></span>
    </div>

    <p class="foot">Any orders already placed are safe and unaffected.</p>
  </main>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     When maintenance is expected to finish (UTC, ISO 8601).
     Change this one line to shift the countdown and the "back around"
     time — everything else updates from it.
  ------------------------------------------------------------------ */
  var ENDS_AT = '2026-11-26T01:10:00Z';

  var end = new Date(ENDS_AT).getTime();
  if (isNaN(end)) return;

  var elBack = document.getElementById('back');
  var elBackTime = document.getElementById('back-time');
  var elCount = document.getElementById('count');
  var h = document.getElementById('c-h'), m = document.getElementById('c-m'), s = document.getElementById('c-s');

  /* Shown in the visitor's own timezone, with the zone abbreviation. */
  try {
    elBackTime.textContent = new Date(end).toLocaleTimeString([], {
      hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
    elBack.hidden = false;
  } catch (e) { /* leave the line hidden */ }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function tick() {
    var left = end - Date.now();
    if (left <= 0) {
      elCount.hidden = true;
      document.querySelector('.lead').textContent =
        'We should be back any moment now. Please refresh in a minute.';
      clearInterval(timer);
      return;
    }
    var secs = Math.floor(left / 1000);
    h.textContent = pad(Math.floor(secs / 3600));
    m.textContent = pad(Math.floor(secs % 3600 / 60));
    s.textContent = pad(secs % 60);
    elCount.hidden = false;
  }

  tick();
  var timer = setInterval(tick, 1000);
})();
</script>
</body>
</html>
