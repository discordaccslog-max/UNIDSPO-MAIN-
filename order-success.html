<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — United Dispo</title>
<meta name="description" content="Your United Dispo order has been received.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --bg: #0e0e10;
    --side: #151517;
    --line: rgba(255,255,255,.10);
    --text: #f2f2f3;
    --muted: #9ea0a6;
    --gold: #d4af37;
    --gold-hi: #ffd976;
    --ok: #7fd3a8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  .co-head { background: #000; border-bottom: 1px solid var(--line); }
  .co-head__in { max-width: 1180px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .co-logo { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .16em; text-decoration: none; color: #fff; white-space: nowrap; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 72px 32px 96px; }
  .done { text-align: center; }
  .done__icon { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: rgba(127, 211, 168, 0.12); color: var(--ok); margin-bottom: 22px; }
  .done__icon svg { width: 36px; height: 36px; }
  .done__kicker { margin: 0; color: var(--gold-hi); font-size: 12.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .done__h { font-family: "Oswald", sans-serif; font-size: 36px; font-weight: 600; letter-spacing: 1px; margin: 10px 0 14px; }
  .done__p { color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0 auto 20px; max-width: 480px; }
  .done__p b { color: #fff; }
  .done__btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 26px; padding: 0 30px; border-radius: 999px; border: 1px solid #ffd700; background: linear-gradient(180deg, #e8c766, #ba9930); color: #111; font-family: "Oswald", sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; text-decoration: none; }
  .done__note { margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<header class="co-head">
  <div class="co-head__in">
    <a href="/" class="co-logo">UNITED DISPO</a>
  </div>
</header>

<main class="wrap">
  <div class="done" tabindex="-1">
    <span class="done__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </span>
    <p class="done__kicker">Order received</p>
    <h1 class="done__h">Thank you for your order</h1>
    <p class="done__p">Your order is being prepared and will ship within <b>1–2 business days</b>. You'll be emailed automatically with your tracking number the moment it leaves our facility.</p>
    <a class="done__btn" href="/catalog.html">Continue shopping</a>
    <p class="done__note">Questions about your order? <a href="/contact.html" style="color: var(--gold-hi);">Contact us</a>.</p>
  </div>
</main>

<script src="js/cart.js"></script>
<script>
  // Clear the cart once a customer lands here — their payment is complete.
  try {
    if (window.UNI_CART && typeof window.UNI_CART.clear === 'function') {
      window.UNI_CART.clear();
    }
  } catch (e) {}
</script>
</body>
</html>
