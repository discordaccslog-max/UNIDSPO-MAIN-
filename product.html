<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Oswald:ital,wght@0,400;0,500;0,700;0,800;1,500;1,700;1,800&amp;display=swap">

<style>
  .pd-wrap { max-width: 1440px; margin: 0 auto; padding: 36px 50px 80px; }

  .pd { display: grid; grid-template-columns: 1fr; gap: 32px; }
  @media(min-width: 860px) {
    .pd { grid-template-columns: 55% 45%; gap: 0; }
    .pd-info { padding-left: 50px; }
  }

  /* Gallery — flat, image takes its natural portrait height */
  .pd-gallery { display: flex; flex-direction: column; gap: 14px; align-self: start; }
  .pd-hero {
    position: relative; width: 100%;
    background: transparent; border: 0; border-radius: 0;
    overflow: hidden;
  }
  .pd-hero img {
    width: 100%; height: auto;
    object-fit: contain; display: block;
  }
  .pd-hero__badge {
    position: absolute; bottom: 16px; left: 16px;
    padding: 8px 16px; background: #000;
    border: 0; border-radius: 999px;
    color: #fff; font-size: 13px; font-weight: 500;
    letter-spacing: .02em; line-height: 1;
  }
  .pd-thumbs { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .pd-thumb {
    width: 118px; height: 118px; padding: 0; background: #161718;
    border: 2px solid rgba(255,255,255,.08); border-radius: 10px;
    overflow: hidden; cursor: pointer;
    transition: border-color .2s ease, transform .2s ease;
  }
  @media (max-width: 749px) {
    .pd-thumb { width: 84px; height: 84px; }
  }
  .pd-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .3s ease;
  }
  .pd-thumb:hover { border-color: rgba(255,255,255,.35); }
  .pd-thumb.is-active {
    border-color: #ffffff;
    border-width: 2px;
  }

  /* Info */
  .pd-info h1 {
    font-family: "Oswald", sans-serif; font-weight: 500;
    font-size: clamp(28px, 2.8vw, 44px); line-height: 1.12;
    letter-spacing: .84px; margin: 0 0 12px; color: #fff;
  }
  .pd-kicker {
    display: inline-block; padding: 5px 10px;
    background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.3);
    border-radius: 999px; color: #FFD976;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 700; margin-bottom: 14px;
  }
  .pd-price {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin: 10px 0 14px;
    font-family: "Oswald", sans-serif;
    font-size: 30px; color: #ffffff; letter-spacing: .5px;
  }
  .pd-price .compare {
    font-size: 18px; color: #777; text-decoration: line-through;
  }
  .pd-price__soldout {
    display: inline-flex; align-items: center;
    padding: 6px 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: .3px;
  }

  .pd-stock {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 4px 0 20px;
    font-size: 15px; color: #B9BBC0; font-weight: 500;
  }
  .pd-stock__dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.08);
    position: relative;
  }
  .pd-stock__dot::after {
    content: ""; position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,.6);
    transform: translate(-50%, -50%);
  }
  .pd-stock--low .pd-stock__dot {
    border-color: #E8A54F;
    background: rgba(232,165,79,.18);
  }
  .pd-stock--low .pd-stock__dot::after { background: #E8A54F; }
  .pd-desc { color: #B9BBC0; line-height: 1.75; font-size: 15px; margin: 0 0 24px; }

  .pd-sec-label {
    display: block; font-size: 15px; letter-spacing: .1px;
    color: #B9BBC0; margin: 18px 0 10px;
  }

  /* Variants (unidispo.com-style pills: dark outline → white when selected) */
  .pd-variants { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 24px; }
  .pd-variant {
    padding: 10px 18px; background: transparent;
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
    color: #fff; font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pd-variant:hover { border-color: rgba(255,255,255,.55); }
  .pd-variant.is-selected {
    background: #ffffff; border-color: #ffffff; color: #0e0e10;
    font-weight: 600;
  }
  /* Sold-out variant — strikethrough + muted, matches live reference */
  .pd-variant.is-out {
    color: rgba(255,255,255,.4);
    border-color: rgba(255,255,255,.14);
    text-decoration: line-through;
    cursor: not-allowed;
  }
  .pd-variant.is-out:hover { border-color: rgba(255,255,255,.14); }

  /* Buy it now — matches unidispo.com spec (Shopify Dawn custom block):
       linear-gradient(180deg,#E8C766,#BA9930), 1px #FFD700 border,
       4px radius, 14px vertical padding, 20px top margin, shadow
       0 2px 4px rgba(0,0,0,.2); hover gradient #FFD976→#C8A732 with
       shadow 0 4px 12px rgba(212,175,55,.35). */
  .pd-buy {
    display: block; width: 100%;
    margin: 20px 0 0; padding: 14px 24px;
    background: linear-gradient(180deg, #E8C766, #BA9930);
    color: #111; border: 1px solid #FFD700; border-radius: 4px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
    font-family: inherit; font-size: 16px; font-weight: 600;
    letter-spacing: .3px; cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .pd-buy:hover {
    background: linear-gradient(180deg, #FFD976, #C8A732);
    box-shadow: 0 4px 12px rgba(212,175,55,.35);
  }
  .pd-buy:active { transform: translateY(1px); }
  .pd-buy.is-added {
    background: #2d2d2e; color: #FFD976;
    border-color: rgba(212,175,55,.5);
    box-shadow: none;
  }
  .pd-buy[disabled] {
    background: #2a2a2b; color: #777;
    border-color: rgba(255,255,255,.1);
    cursor: not-allowed; box-shadow: none;
  }

  /* Security line — 12.5px grey #9ca3af, lock icon #10b981, Shopify/Whop bold green */
  .pd-secure {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: 10px 0 20px;
    font-size: 12.5px; color: #9ca3af; letter-spacing: .2px;
  }
  .pd-secure svg { flex: 0 0 14px; color: #10b981; }
  .pd-secure strong { color: #10b981; font-weight: 700; }

  /* Quantity */
  .pd-qty-wrap { margin: 24px 0 8px; }
  .pd-qty {
    display: inline-flex; align-items: center;
    border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
    overflow: hidden;
  }
  .pd-qty__btn {
    width: 48px; height: 52px;
    background: transparent; border: 0; color: #fff;
    font-size: 20px; cursor: pointer; font-family: inherit;
    transition: background .15s ease;
  }
  .pd-qty__btn:hover { background: rgba(255,255,255,.06); }
  .pd-qty__num {
    width: 72px; height: 52px; background: transparent;
    border: 0; border-left: 1px solid rgba(255,255,255,.14);
    border-right: 1px solid rgba(255,255,255,.14);
    color: #fff; text-align: center;
    font-size: 16px; font-weight: 500; font-family: inherit;
    -moz-appearance: textfield;
  }
  .pd-qty__num::-webkit-outer-spin-button,
  .pd-qty__num::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .pd-qty-label {
    display: block; font-size: 15px; color: #B9BBC0;
    margin: 0 0 10px; letter-spacing: .3px;
  }

  /* Highlights / spec lines — mixed-weight statements under the buy block.
     Base text is muted; inline <strong> (from **bold** markers) prints
     pure white and bold. A line with no bold markers reads as a whole-
     white bold statement (handled by wrapping it in <strong> at render).
     Font switched from Figtree to Avenir Next to match the live site. */
  .pd-highlights {
    margin: 36px 0 24px;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(16px, 1.3vw, 19px);
    font-weight: 500;
    color: #B9BBC0;
    line-height: 1.5;
    letter-spacing: 0;
  }
  .pd-highlights p { margin: 0 0 20px; }
  .pd-highlights p:last-child { margin-bottom: 0; }
  .pd-highlights strong { color: #ffffff; font-weight: 700; }
  /* Featured heading — "## " prefixed highlight renders larger (h2 in catalog) */
  .pd-highlights h2 {
    font-family: inherit;
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0;
    line-height: 1.25;
    margin: 0 0 26px;
    text-transform: uppercase;
  }

  /* Share — subtle, matches live reference (muted white, no accent color) */
  .pd-share {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 20px 0 0; padding: 0;
    background: transparent; border: 0;
    color: #ffffff; font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .pd-share:hover { color: #B9BBC0; }
  .pd-share svg { flex: 0 0 16px; }

  /* You may also like */
  .pd-related {
    margin-top: 48px; padding-top: 0;
    border-top: 0;
  }
  .pd-related h2 {
    margin: 0 0 16px; font-family: "Oswald", sans-serif;
    font-size: clamp(36px, 4.6vw, 64px); font-weight: 500;
    letter-spacing: .84px; color: #fff; text-transform: uppercase;
    line-height: 1.1;
  }
  .pd-related__grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media(min-width: 750px) { .pd-related__grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; } }
  .pd-related__card {
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none; color: inherit;
  }
  .pd-related__media {
    position: relative; width: 100%; aspect-ratio: 4 / 5;
    background: #161718; border-radius: 0; overflow: hidden;
  }
  .pd-related__media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .35s ease;
  }
  .pd-related__img--hover { opacity: 0; }
  /* Only cross-fade the primary image when a secondary image exists
     (media container carries the --has-hover modifier). Otherwise the
     primary stays visible on hover and nothing goes black. */
  .pd-related__card:hover .pd-related__media--has-hover .pd-related__img--primary { opacity: 0; }
  .pd-related__card:hover .pd-related__media--has-hover .pd-related__img--hover { opacity: 1; }
  .pd-related__title {
    margin: 2px 0 0;
    font-family: "Oswald", sans-serif; font-weight: 500;
    font-size: 15px; letter-spacing: .5px;
    text-transform: uppercase; color: #fff; line-height: 1.3;
  }
  .pd-related__card:hover .pd-related__title {
    text-decoration: underline; text-underline-offset: 3px;
  }
  .pd-related__price { margin: 0; font-size: 14px; color: #B9BBC0; }

  /* Assurances */
  .pd-assure {
    display: grid; gap: 10px; margin-top: 10px; padding: 16px;
    background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px;
  }
  .pd-assure__row {
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 13px; color: #B9BBC0; line-height: 1.5;
  }
  .pd-assure__row strong { color: #fff; font-weight: 600; }
  .pd-assure__ic {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px;
    background: rgba(212,175,55,.12); border: 1px solid rgba(212,175,55,.3);
    display: grid; place-items: center; font-size: 15px;
  }

  /* Not-found */
  .pd-404 {
    max-width: 600px; margin: 60px auto; padding: 40px;
    background: #141416; border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px; text-align: center;
  }
  .pd-404 h1 { font-family: "Oswald", sans-serif; font-weight: 500; margin: 0 0 10px; }
  .pd-404 p { color: #A5A7AC; margin: 0 0 20px; }
  .pd-404 a {
    display: inline-block; padding: 12px 24px;
    background: linear-gradient(180deg, #E8C766, #BA9930); color: #111;
    border-radius: 10px; text-decoration: none; font-weight: 800;
  }

  /* ============ Animations — copied from unidispo.com ============
     Dawn theme tokens:
       --duration-long: .5s
       --duration-extra-long: .6s
       --ease-out-slow: cubic-bezier(0, 0, .3, 1)   ← slide-in easing
     Used on: .scroll-trigger.animate--slide-in and .animate--fade-in */

  @media (prefers-reduced-motion: no-preference) {
    .pd-reveal {
      opacity: 0;
      transform: translateY(1.5rem);
    }
    .pd-reveal.is-visible {
      animation: pd-slide-in .6s cubic-bezier(0, 0, .3, 1) forwards;
    }
  }
  @keyframes pd-slide-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Media opacity transition matches live site's .media > img */
  .pd-related__media img { transition: opacity .4s cubic-bezier(.25, .46, .45, .94); }

  /* Card lift on hover */
  .pd-related__card { transition: transform .3s cubic-bezier(0, 0, .3, 1); }
  .pd-related__card:hover { transform: translateY(-2px); }

  /* Toast */
  .pd-toast {
    position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 24px);
    background: #141416; border: 1px solid rgba(212,175,55,.5);
    border-left: 3px solid #D4AF37;
    border-radius: 10px; padding: 14px 20px;
    color: #fff; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; z-index: 9999;
    transition: opacity .25s ease, transform .35s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .pd-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<div id="age-gate">
  <div class="uni-age-gate__card">
    <div class="uni-age-gate__badge">Adults Only</div>
    <h2 class="uni-age-gate__title">You must be 21+ to enter</h2>
    <p class="uni-age-gate__text">This site sells vape products intended for adults only.</p>
    <div class="uni-age-gate__actions">
      <button id="age-yes" class="uni-age-gate__btn uni-age-gate__btn--yes" type="button">I am 21+</button>
      <button id="age-no" class="uni-age-gate__btn uni-age-gate__btn--no" type="button">I am under 21</button>
    </div>

<script>
(function(){
  var k='age_verified_21', days=30;
  function setCookie(n,v,d){ var t=new Date(); t.setTime(t.getTime()+d*864e5); document.cookie=n+'='+v+';expires='+t.toUTCString()+';path=/'; }
  function getCookie(n){ var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)'); return m?m.pop():''; }
  function show(){ document.getElementById('age-gate').style.display='block'; document.body.style.overflow='hidden'; }
  function hide(){ document.getElementById('age-gate').style.display='none'; document.body.style.overflow=''; }
  if(!getCookie(k)) show();
  document.getElementById('age-yes').addEventListener('click', function(){ setCookie(k,'yes',days); hide(); });
  document.getElementById('age-no').addEventListener('click', function(){ window.location.href='https://www.google.com'; });
})();
</script>

<script>
(function () {
  var slides = document.querySelectorAll('.uni-announce__slide');
  if (slides.length < 2) return;
  var i = 0, timer;
  function show(n){ slides.forEach(function(s){ s.classList.remove('is-active'); }); slides[n].classList.add('is-active'); }
  function next(){ i = (i + 1) % slides.length; show(i); }
  function prev(){ i = (i - 1 + slides.length) % slides.length; show(i); }
  function restart(){ clearInterval(timer); timer = setInterval(next, 4000); }
  timer = setInterval(next, 4000);
  document.querySelector('.uni-announce__arrow--prev').addEventListener('click', function(){ prev(); restart(); });
  document.querySelector('.uni-announce__arrow--next').addEventListener('click', function(){ next(); restart(); });
})();
</script>

<script>
(function () {
  var slug = new URLSearchParams(window.location.search).get('id') || '';
  var p = window.UNI_CATALOG[slug];
  var root = document.getElementById('pd-root');
  var toast = document.getElementById('pd-toast');

  if (!p) {
    root.innerHTML =
      '<div class="pd-404">' +
        '<h1>Product not found</h1>' +
        '<p>We couldn\'t find a product with that ID.</p>' +
        '<a href="catalog.html">Back to catalog</a>' +
      '</div>';
    document.title = 'Product not found — UNI';
    return;
  }

  document.title = p.title + ' — UNI';
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', p.description);

  var fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  function money(n){ return fmt.format(n) + ' USD'; }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* Sold-out pill in the bottom-left of the hero image (matches the
     live product card style). Sale badge wins over sold-out. */
  var badge = '';
  if (p.compareAt && Number(p.compareAt) > Number(p.price)) badge = '<span class="pd-hero__badge">Sale</span>';
  else if (!p.available) badge = '<span class="pd-hero__badge">Sold out</span>';

  var variantLabel = p.variantLabel || 'Variant';
  var soldOut = (p.soldOutVariants || []).reduce(function (m, v) { m[v] = true; return m; }, {});
  /* First selected variant is the first non-sold-out one (or the first) */
  var firstAvailableIdx = (p.variants || []).findIndex(function (v) { return !soldOut[v]; });
  if (firstAvailableIdx < 0) firstAvailableIdx = 0;
  var variantsBlock = '';
  if (p.variants && p.variants.length > 0) {
    variantsBlock = '<span class="pd-sec-label">' + esc(variantLabel) + '</span><div class="pd-variants" role="radiogroup" aria-label="' + esc(variantLabel) + '">';
    p.variants.forEach(function(v, i){
      var out = !!soldOut[v];
      var selected = (i === firstAvailableIdx);
      variantsBlock += '<button type="button" class="pd-variant' + (selected ? ' is-selected' : '') + (out ? ' is-out' : '') + '"' +
        ' role="radio" aria-checked="' + (selected ? 'true' : 'false') + '"' +
        (out ? ' aria-disabled="true"' : '') +
        ' data-v="' + esc(v) + '">' + esc(v) + '</button>';
    });
    variantsBlock += '</div>';
  }

  var thumbsBlock = '';
  if (p.images.length > 1) {
    thumbsBlock = '<div class="pd-thumbs">';
    p.images.forEach(function(src, i){
      thumbsBlock += '<button type="button" class="pd-thumb' + (i === 0 ? ' is-active' : '') + '" data-src="' + esc(src) + '"><img src="' + esc(src) + '" alt=""></button>';
    });
    thumbsBlock += '</div>';
  }

  var priceHtml = '<div class="pd-price"><span>' + esc(money(p.price)) + '</span>';
  if (p.compareAt && Number(p.compareAt) > Number(p.price)) {
    priceHtml += '<span class="compare">' + esc(money(p.compareAt)) + '</span>';
  }
  if (!p.available) {
    priceHtml += '<span class="pd-price__soldout">Sold out</span>';
  }
  priceHtml += '</div>';

  var stockHtml = '';
  if (!p.available) {
    stockHtml = '<div class="pd-stock" role="status"><span class="pd-stock__dot" aria-hidden="true"></span><span>Out of stock</span></div>';
  } else if (p.stockStatus === 'low') {
    stockHtml = '<div class="pd-stock pd-stock--low" role="status"><span class="pd-stock__dot" aria-hidden="true"></span><span>Low stock</span></div>';
  }

  /* Buy-it-now stays visible even when sold out (matching the live site);
     the click handler shows a toast instead of placing an order. */
  var buyLabel = 'Buy it now';
  var buyDisabled = '';

  /* Highlights / specs block. Lines can use **markdown bold** to
     emphasize particular phrases in white; the rest stays muted. A line
     with no bold markers is wrapped in <strong> so the whole statement
     reads white, matching products like Ace Ultra. */
  function renderHighlight(line) {
    /* Lines prefixed with "## " render as an <h2> featured heading */
    if (line.indexOf('## ') === 0) {
      return '<h2>' + esc(line.slice(3)) + '</h2>';
    }
    var s = esc(line);
    if (s.indexOf('**') === -1) {
      return '<p><strong>' + s + '</strong></p>';
    }
    return '<p>' + s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') + '</p>';
  }
  var highlightsBlock = '';
  if (p.highlights && p.highlights.length) {
    highlightsBlock = '<div class="pd-highlights">';
    p.highlights.forEach(function (line) {
      highlightsBlock += renderHighlight(line);
    });
    highlightsBlock += '</div>';
  }

  /* You may also like — related products, or auto-fill with 4 others */
  var relatedBlock = '';
  var relatedIds = (p.related && p.related.length)
    ? p.related
    : Object.keys(window.UNI_CATALOG).filter(function (k) { return k !== slug; }).slice(0, 4);
  var relatedItems = relatedIds
    .map(function (id) { return window.UNI_CATALOG[id] ? { slug: id, p: window.UNI_CATALOG[id] } : null; })
    .filter(Boolean)
    .slice(0, 4);
  if (relatedItems.length) {
    relatedBlock = '<section class="pd-related"><h2 class="pd-reveal" style="--pd-order:0">You may also like</h2><div class="pd-related__grid">';
    relatedItems.forEach(function (it, i) {
      var imgs = it.p.images || [];
      var primary = imgs[0] || '';
      var hoverImg = imgs[1] || '';
      var media = '<div class="pd-related__media' + (hoverImg ? ' pd-related__media--has-hover' : '') + '">' +
        '<img class="pd-related__img pd-related__img--primary" src="' + esc(primary) + '" alt="' + esc(it.p.title) + '" loading="lazy">' +
        (hoverImg ? '<img class="pd-related__img pd-related__img--hover" src="' + esc(hoverImg) + '" alt="" loading="lazy" aria-hidden="true">' : '') +
      '</div>';
      relatedBlock +=
        '<a class="pd-related__card pd-reveal" style="--pd-order:' + (i + 1) + '" href="product.html?id=' + encodeURIComponent(it.slug) + '">' +
          media +
          '<h3 class="pd-related__title">' + esc(it.p.title) + '</h3>' +
          '<p class="pd-related__price">' + esc(money(it.p.price)) + '</p>' +
        '</a>';
    });
    relatedBlock += '</div></section>';
  }

  root.innerHTML =
    '<div class="pd">' +
      '<div class="pd-gallery pd-reveal" style="--pd-order:0">' +
        '<div class="pd-hero">' +
          badge +
          '<img id="pd-heroimg" src="' + esc(p.images[0]) + '" alt="' + esc(p.title) + '">' +
        '</div>' +
        thumbsBlock +
      '</div>' +
      '<div class="pd-info">' +
        '<h1 class="pd-reveal" style="--pd-order:1">' + esc(p.title) + '</h1>' +
        '<div class="pd-reveal" style="--pd-order:2">' + priceHtml + '</div>' +
        (variantsBlock ? '<div class="pd-reveal" style="--pd-order:3">' + variantsBlock + '</div>' : '') +
        (stockHtml ? '<div class="pd-reveal" style="--pd-order:4">' + stockHtml + '</div>' : '') +
        '<div class="pd-reveal" style="--pd-order:5">' +
        '<button type="button" class="pd-buy" id="pd-buy" ' + buyDisabled + '>' + esc(buyLabel) + '</button>' +
        '<div class="pd-secure">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
          '<span>Checkout secured by <strong>Shopify</strong> / <strong>Whop</strong></span>' +
        '</div>' +
        '</div>' +
        '<div class="pd-reveal" style="--pd-order:6">' +
          '<div class="pd-qty-wrap">' +
            '<label class="pd-qty-label" for="pd-qty">Quantity</label>' +
            '<div class="pd-qty">' +
              '<button type="button" class="pd-qty__btn" id="pd-dec" aria-label="Decrease quantity">−</button>' +
              '<input class="pd-qty__num" id="pd-qty" type="number" min="1" value="1" aria-label="Quantity">' +
              '<button type="button" class="pd-qty__btn" id="pd-inc" aria-label="Increase quantity">+</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        (highlightsBlock ? '<div class="pd-reveal" style="--pd-order:7">' + highlightsBlock + '</div>' : '') +
        '<button type="button" class="pd-share pd-reveal" id="pd-share" style="--pd-order:8" aria-label="Share this product">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>' +
          '<span>Share</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    relatedBlock;

  /* Variant selection — sold-out variants cannot be selected */
  var selectedVariant = (p.variants && p.variants.length > 0) ? p.variants[firstAvailableIdx] : null;
  root.querySelectorAll('.pd-variant').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.classList.contains('is-out')) return;
      root.querySelectorAll('.pd-variant').forEach(function (b) {
        b.classList.remove('is-selected');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('is-selected');
      btn.setAttribute('aria-checked', 'true');
      selectedVariant = btn.getAttribute('data-v');
    });
  });

  /* Scroll-reveal: fade+rise the info blocks, related heading and cards */
  (function initReveal() {
    var els = document.querySelectorAll('.pd-reveal');
    if (!('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    els.forEach(function (el) { io.observe(el); });
  })();

  /* Thumbnail gallery */
  var heroImg = document.getElementById('pd-heroimg');
  root.querySelectorAll('.pd-thumb').forEach(function (t) {
    t.addEventListener('click', function () {
      root.querySelectorAll('.pd-thumb').forEach(function (x) { x.classList.remove('is-active'); });
      t.classList.add('is-active');
      heroImg.src = t.getAttribute('data-src');
    });
  });

  /* Quantity */
  var qtyInput = document.getElementById('pd-qty');
  document.getElementById('pd-dec').addEventListener('click', function () {
    qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);
  });
  document.getElementById('pd-inc').addEventListener('click', function () {
    qtyInput.value = (parseInt(qtyInput.value, 10) || 1) + 1;
  });
  qtyInput.addEventListener('change', function () {
    var n = parseInt(qtyInput.value, 10);
    if (!n || n < 1) qtyInput.value = 1;
  });

  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add('is-visible');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.classList.remove('is-visible');
    }, ms || 2500);
  }

  /* Buy it now — adds to the real cart (localStorage via cart.js) and
     navigates to the cart page so the user can review + check out. */
  var buyBtn = document.getElementById('pd-buy');
  if (buyBtn) {
    buyBtn.addEventListener('click', function () {
      if (!p.available) {
        showToast('This item is sold out — restock pending', 2800);
        return;
      }
      var qty = parseInt(qtyInput.value, 10) || 1;
      window.UNI_CART.add({
        slug: slug,
        title: p.title,
        price: p.price,
        variant: selectedVariant || '',
        qty: qty,
        image: (p.images && p.images[0]) || ''
      });
      showToast('Added ' + qty + ' × ' + p.title + ' to cart', 1500);
      buyBtn.classList.add('is-added');
      buyBtn.textContent = '✓ Added to cart';
      setTimeout(function () { window.location.href = 'cart.html'; }, 900);
    });
  }

  /* Share */
  var shareBtn = document.getElementById('pd-share');
  if (shareBtn) {
    shareBtn.addEventListener('click', function () {
      var shareData = { title: p.title + ' — UNI', text: p.description, url: window.location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window.location.href).then(function () {
          showToast('Link copied to clipboard');
        }).catch(function () {
          showToast(window.location.href);
        });
      } else {
        showToast(window.location.href);
      }
    });
  }
})();
</script>
</body>
</html>
